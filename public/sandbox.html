<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Untrusted, model-generated code runs in this document. Defense in depth:
      the parent mounts it with sandbox="allow-scripts" (no allow-same-origin,
      so it's an opaque origin with no access to cookies, storage, or the parent
      DOM), and this CSP forbids all network egress (connect-src 'none') while
      still allowing our own bundled runtime (script-src 'self') and the eval
      that Babel + new Function require.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="/katex.min.css" />
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; }
      body {
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #14171d;
        padding: 24px;
      }
      #root { max-width: 720px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/sandbox-runtime.js"></script>
  </body>
</html>
