<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Untrusted, model-generated code runs in this document. Defense in depth:
      the parent mounts it with sandbox="allow-scripts" (no allow-same-origin,
      so it's an opaque origin with no access to cookies, storage, or the parent
      DOM), and this CSP forbids all network egress (connect-src 'none') while
      still allowing our own bundled runtime (script-src 'self') and the eval
      that Babel + new Function require.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="/katex.min.css" />
    <!-- Mafs' core.css. Its font.css is intentionally absent: it @imports a
         webfont, which connect-src 'none' above would block. -->
    <link rel="stylesheet" href="/mafs-core.css" />
    <style>
      /* The lesson's own typography. Model-authored markup (a bare <button>, a
         <p> out of marked) has to look deliberate without the author styling it,
         so the defaults here ARE the house style. SDK components set inline
         styles, which outrank every rule below — these dress what they don't. */
      :root {
        color-scheme: light;
        --ink: #16191f;
        --ink-soft: #59606e;
        --line: #e4e7ee;
        --accent: #2f6df0;
        --accent-soft: #eef3fe;
      }
      html, body { margin: 0; }
      body {
        font: 17px/1.7 ui-serif, Georgia, Cambria, "Times New Roman", serif;
        color: var(--ink);
        padding: 28px 24px 40px;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #root { max-width: 720px; margin: 0 auto; }

      /* Headings, controls and chrome stay in the UI face; only the reading
         voice is serif. That contrast is what makes a lesson read as typeset
         rather than as a web form. */
      h1, h2, h3, h4, button, input, select, label, table, .mafs-shadow, text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      h1, h2, h3 { line-height: 1.25; letter-spacing: -0.015em; font-weight: 650; }
      h2 { font-size: 1.45rem; margin: 0 0 12px; }
      h3 { font-size: 1.1rem; margin: 22px 0 8px; }
      p { margin: 0 0 14px; }
      p:last-child { margin-bottom: 0; }
      ul, ol { margin: 0 0 14px; padding-left: 22px; }
      li { margin: 4px 0; }
      strong { font-weight: 650; }
      hr { border: none; border-top: 1px solid var(--line); margin: 28px 0; }
      code {
        font: 0.88em/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #f3f5f9;
        border-radius: 4px;
        padding: 1px 5px;
      }
      a { color: var(--accent); }

      /* A bare <button> the lesson wrote itself — the most common freeform
         element — gets the same affordance as an SDK control. */
      button {
        font-size: 0.92rem;
        font-weight: 550;
        padding: 7px 14px;
        border: 1px solid #ccd3e0;
        border-radius: 8px;
        background: linear-gradient(#fff, #f7f8fb);
        color: var(--ink);
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }
      button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
      button:active:not(:disabled) { transform: translateY(0.5px); }
      button:disabled { opacity: 0.45; cursor: default; }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      input[type="text"], input[type="number"], input:not([type]) {
        font-size: 0.95rem;
        padding: 7px 11px;
        border: 1px solid #ccd3e0;
        border-radius: 8px;
        background: #fff;
      }
      input[type="range"] { accent-color: var(--accent); height: 22px; }

      /* Display math should breathe; KaTeX's own margin is too tight to carry a
         derivation. */
      .katex-display { margin: 20px 0; }
      .katex { font-size: 1.04em; }

      /* Mafs ships a dark theme; the lesson surface is light. These have to sit
         on .MafsView itself (that is the selector core.css declares them on),
         and win by source order. */
      .MafsView {
        --mafs-bg: #fff;
        --mafs-fg: #16191f;
        --mafs-line-color: #e4e7ee;
        --grid-line-subdivision-color: #f3f5f9;
        --mafs-origin-color: #b7bdc9;
        font-size: 12px;
      }
      .bw-plot, .bw-scene {
        margin: 20px 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 1px 2px rgba(20, 23, 29, 0.04), 0 8px 24px -16px rgba(20, 23, 29, 0.3);
      }

      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/sandbox-runtime.js"></script>
  </body>
</html>
